<text x="245.0" y="407" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Claude SDK Client</text>
<text x="245.0" y="426" text-anchor="middle" fill="#3a3a3a" font-size="12">Query() → ReceiveResponse()</text>
<rect x="120" y="510" width="250" height="64" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#sh)"/>
<text x="245.0" y="537" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">receiveQueryResponses()</text>
<text x="245.0" y="556" text-anchor="middle" fill="#3a3a3a" font-size="12">defer: turn complete</text>
