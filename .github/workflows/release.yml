  release:
    name: Create Release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R dist

      - name: Package macOS binaries with dylibs
        run: |
          cd dist
          # Package macOS binaries as tar.gz with bundled dylibs
          for arch in amd64 arm64; do
            if [ -f "wee-darwin-${arch}" ] && [ -d "lib-darwin-${arch}" ]; then
              mkdir -p "wee-darwin-${arch}-pkg/bin" "wee-darwin-${arch}-pkg/lib" "wee-darwin-${arch}-pkg/licenses"
              cp "wee-darwin-${arch}" "wee-darwin-${arch}-pkg/bin/wee"
              cp lib-darwin-${arch}/*.dylib "wee-darwin-${arch}-pkg/lib/" 2>/dev/null || true
              # Wee's own license plus upstream notices for the bundled dylibs
              cp ../LICENSE "wee-darwin-${arch}-pkg/LICENSE"
              cp ../licenses/*.txt ../licenses/THIRD_PARTY_NOTICES.md "wee-darwin-${arch}-pkg/licenses/"
              # Recreate symlink
              cd "wee-darwin-${arch}-pkg/lib" && ln -sf libonnxruntime.1.23.2.dylib libonnxruntime.dylib 2>/dev/null || true && cd ../..
              tar -czf "wee-darwin-${arch}.tar.gz" -C "wee-darwin-${arch}-pkg" .
              echo "Created wee-darwin-${arch}.tar.gz"
            fi
          done
          cd ..

      - name: Assemble third-party notice bundle
        run: |
          mkdir -p dist/notice-pkg/licenses
          cp LICENSE dist/notice-pkg/LICENSE
          cp licenses/*.txt licenses/THIRD_PARTY_NOTICES.md dist/notice-pkg/licenses/
          tar -czf dist/wee-licenses.tar.gz -C dist/notice-pkg .
          rm -rf dist/notice-pkg

      - name: Generate SHA256 checksums
        id: checksums
        run: |
          cd dist
          echo "sha256_darwin_amd64=$(shasum -a 256 wee-darwin-amd64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_darwin_arm64=$(shasum -a 256 wee-darwin-arm64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_linux_amd64=$(shasum -a 256 wee-linux-amd64 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_linux_arm64=$(shasum -a 256 wee-linux-arm64 | awk '{print $1}')" >> $GITHUB_OUTPUT
          cd ..

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate Homebrew formula
        run: |
          sed -e "s/{{VERSION}}/${{ steps.version.outputs.version }}/g" \
              -e "s/{{SHA256_DARWIN_AMD64}}/${{ steps.checksums.outputs.sha256_darwin_amd64 }}/g" \
              -e "s/{{SHA256_DARWIN_ARM64}}/${{ steps.checksums.outputs.sha256_darwin_arm64 }}/g" \
              -e "s/{{SHA256_LINUX_AMD64}}/${{ steps.checksums.outputs.sha256_linux_amd64 }}/g" \
              -e "s/{{SHA256_LINUX_ARM64}}/${{ steps.checksums.outputs.sha256_linux_arm64 }}/g" \
              .github/homebrew-formula.rb.template > dist/wee.rb

      - name: Get release name from tag
        id: release_name
        run: |
          # Get the tag annotation message (first line only, excluding GPG signature)
          TAG_MESSAGE=$(git tag -l --format='%(contents:lines=1)' ${GITHUB_REF#refs/tags/})
          echo "tag_message=$TAG_MESSAGE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            dist/wee-darwin-amd64.tar.gz
            dist/wee-darwin-arm64.tar.gz
            dist/wee-linux-amd64
            dist/wee-linux-arm64
            dist/wee-licenses.tar.gz
          name: ${{ steps.release_name.outputs.tag_message }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Homebrew formula to tap
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "📦 Homebrew formula generated at dist/wee.rb"
          cat dist/wee.rb

          # Push formula to homebrew-wee tap repository using GitHub API
          TAP_TOKEN="${{ secrets.HOMEBREW_TAP_TOKEN }}"
          if [ -z "$TAP_TOKEN" ]; then
            echo "⚠️  HOMEBREW_TAP_TOKEN secret not set. Skipping tap update."
            echo "To enable automatic tap updates, create a PAT with 'repo' scope"
            echo "and add it as a repository secret named HOMEBREW_TAP_TOKEN"
            exit 0
          fi

          FORMULA_CONTENT=$(base64 -w0 < $GITHUB_WORKSPACE/dist/wee.rb)

          # Get current file SHA if it exists
          EXISTING_SHA=$(curl -s \
            -H "Authorization: token ${TAP_TOKEN}" \
            "https://api.github.com/repos/schlunsen/homebrew-wee/contents/Formula/wee.rb" \
            | jq -r '.sha // empty')

          # Create or update the formula file
          if [ -n "$EXISTING_SHA" ]; then
            curl -sf -X PUT \
              -H "Authorization: token ${TAP_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/schlunsen/homebrew-wee/contents/Formula/wee.rb" \
              -d "{\"message\":\"Update formula for v${{ steps.version.outputs.version }}\",\"content\":\"${FORMULA_CONTENT}\",\"sha\":\"${EXISTING_SHA}\"}"
          else
            curl -sf -X PUT \
              -H "Authorization: token ${TAP_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/schlunsen/homebrew-wee/contents/Formula/wee.rb" \
              -d "{\"message\":\"Add formula for v${{ steps.version.outputs.version }}\",\"content\":\"${FORMULA_CONTENT}\"}"
          fi

          echo "✅ Homebrew tap updated at schlunsen/homebrew-wee"
