<text x="245" y="740" text-anchor="middle" fill="#5a5a5a" font-size="12.5">interactive</text>
<line x1="370" y1="668" x2="575" y2="300" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
