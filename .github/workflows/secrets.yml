name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan tracked source for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan source snapshot
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -x -C "$scan_dir"
          gitleaks dir "$scan_dir" --redact --ignore-gitleaks-allow --gitleaks-ignore-path=/dev/null
