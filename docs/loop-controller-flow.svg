<rect x="575" y="540" width="250" height="68" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#sh)"/>
<text x="700.0" y="579.0" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">verify passed?</text>
<text x="700" y="582" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">verify passed?</text>
<text x="700" y="600" text-anchor="middle" fill="#6a6a6a" font-size="11.5">(or reviewer subagent)</text>
<rect x="575" y="690" width="250" height="64" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#sh)"/>
<text x="700.0" y="717" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">buildRetryPrompt(output)</text>
<text x="700.0" y="736" text-anchor="middle" fill="#3a3a3a" font-size="12">feed failure back in</text>
<rect x="870" y="542" width="210" height="64" rx="12" fill="#8fd19e" stroke="#4a4a4a" stroke-width="2.5" filter="url(#sh)"/>
<text x="975.0" y="569" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">loop_completed ✓</text>
<text x="975.0" y="588" text-anchor="middle" fill="#3a3a3a" font-size="12">broadcast · stop</text>
<text x="700" y="800" text-anchor="middle" fill="#6a6a6a" font-size="12.5">guards: maxIterations · timeout · stop-on-pass · interrupt</text>
