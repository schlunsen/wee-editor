<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;}</style>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#5a5a5a"/></marker>
<marker id="arp" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><polygon points="0 0, 10 4.5, 0 9" fill="#7c3aed"/></marker>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000012"/></filter>
</defs>
<rect width="1120" height="900" fill="#f8f6f3"/>
<text x="40" y="44" fill="#1a1a1a" font-size="24" font-weight="700">LoopController in the Wee Agent Message Flow</text>
<text x="40" y="72" fill="#6a6a6a" font-size="15">Loop mode reuses the existing per-turn pipeline and adds a verify-and-retry controller (the only new piece).</text>
