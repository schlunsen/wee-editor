<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wee</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: transparent;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: radial-gradient(ellipse 85% 80% at 50% 50%, #050510 0%, #050510 55%, rgba(5,5,16,0.8) 70%, rgba(5,5,16,0.4) 82%, rgba(5,5,16,0.1) 90%, transparent 100%);
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Animated grid background */
    .grid-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridScroll 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridScroll {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
    }

    /* Glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0;
      animation: orbPulse 4s ease-in-out infinite, fadeInOrb 2s ease-out forwards;
      z-index: 1;
    }
    .orb-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4), transparent);
      top: -50px; left: -50px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent);
      bottom: -50px; right: -50px;
      animation-delay: 1s;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25), transparent);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 0.5s;
    }

    @keyframes orbPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }
    @keyframes fadeInOrb {
      from { opacity: 0; }
      to { opacity: 0.4; }
    }

    .container {
      text-align: center;
      padding: 2rem;
      z-index: 10;
      position: relative;
      opacity: 0;
      animation: containerFadeIn 0.5s ease-out 0.05s forwards;
    }

    @keyframes containerFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo image with glitch */
    .logo-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 1.5rem;
    }

    .logo-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: logoFadeIn 0.5s ease-out 0.15s forwards;
      box-shadow:
        0 0 20px rgba(99, 102, 241, 0.5),
        0 0 40px rgba(139, 92, 246, 0.3),
        0 0 80px rgba(99, 102, 241, 0.15);
    }

    @keyframes logoFadeIn {
      0% { opacity: 0; filter: brightness(2) saturate(0); transform: scale(0.8); }
      50% { opacity: 0.7; filter: brightness(1.5) saturate(0.5); }
      100% { opacity: 1; filter: brightness(1) saturate(1); transform: scale(1); }
    }

    /* Glitch ring around logo */
    .glitch-ring {
      position: absolute;
      top: -8px; left: -8px;
      width: 156px; height: 156px;
      border: 2px solid rgba(99, 102, 241, 0.6);
      border-radius: 50%;
      opacity: 0;
      animation: ringPulse 2s ease-in-out 0.4s infinite, ringFadeIn 0.3s ease-out 0.25s forwards;
    }
    .glitch-ring::before {
      content: '';
      position: absolute;
      top: -4px; left: -4px;
      width: 164px; height: 164px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 50%;
      animation: ringPulse 2s ease-in-out 0.8s infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes ringFadeIn {
      from { opacity: 0; }
      to { opacity: 0.6; }
    }

    /* Glitching title */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      margin-bottom: 0.3rem;
      position: relative;
      color: #fff;
      text-shadow:
        0 0 10px rgba(99, 102, 241, 0.8),
        0 0 20px rgba(139, 92, 246, 0.5),
        0 0 40px rgba(99, 102, 241, 0.3);
      opacity: 0;
      animation: titleFadeIn 0.5s ease-out 0.3s forwards;
    }

    @keyframes titleFadeIn {
      0% { opacity: 0; letter-spacing: 1em; filter: blur(10px); }
      50% { filter: blur(0); }
      100% { opacity: 1; letter-spacing: 0.3em; }
    }

    /* Glitch effect on title */
    .title::before,
    .title::after {
      content: 'WEE';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      opacity: 0;
    }
    .title::before {
      color: #0ff;
      z-index: -1;
      animation: glitch1 3s ease-in-out 0.5s infinite;
    }
    .title::after {
      color: #f0f;
      z-index: -1;
      animation: glitch2 3s ease-in-out 0.5s infinite;
    }

    @keyframes glitch1 {
      0%, 90%, 100% { opacity: 0; transform: translate(0); }
      91% { opacity: 0.8; transform: translate(-3px, -1px); clip-path: inset(20% 0 60% 0); }
      93% { opacity: 0; }
      94% { opacity: 0.6; transform: translate(2px, 1px); clip-path: inset(40% 0 20% 0); }
      96% { opacity: 0; }
    }

    @keyframes glitch2 {
      0%, 88%, 100% { opacity: 0; transform: translate(0); }
      89% { opacity: 0.6; transform: translate(3px, 1px); clip-path: inset(60% 0 10% 0); }
      91% { opacity: 0; }
      95% { opacity: 0.8; transform: translate(-2px, -1px); clip-path: inset(10% 0 70% 0); }
      97% { opacity: 0; }
    }

    .subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: rgba(99, 102, 241, 0.7);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: subtitleFadeIn 0.4s ease-out 0.45s forwards;
    }

    @keyframes subtitleFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 0.7; transform: translateY(0); }
    }

    /* Cyberpunk loading bar */
    .loader {
      width: 200px;
      height: 3px;
      margin: 0 auto 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: loaderFadeIn 0.3s ease-out 0.6s forwards;
    }

    @keyframes loaderFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4, #8b5cf6);
      border-radius: 2px;
      animation: loading 1.5s ease-in-out 0.7s forwards;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);
      position: relative;
    }

    .loader-bar::after {
      content: '';
      position: absolute;
      right: 0;
      top: -2px;
      width: 6px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #06b6d4, 0 0 20px #6366f1;
    }

    @keyframes loading {
      0% { width: 0%; }
      10% { width: 15%; }
      30% { width: 35%; }
      50% { width: 55%; }
      70% { width: 70%; }
      90% { width: 85%; }
      100% { width: 95%; }
    }

    /* Status text */
    .status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: rgba(6, 182, 212, 0.7);
      letter-spacing: 0.15em;
      opacity: 0;
      animation: statusFadeIn 0.3s ease-out 0.7s forwards;
    }

    .status span {
      animation: statusBlink 1.5s step-end infinite;
    }

    @keyframes statusFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Corner decorations */
    .corner {
      position: fixed;
      width: 30px;
      height: 30px;
      z-index: 50;
      opacity: 0;
      animation: cornerFadeIn 0.3s ease-out 0.4s forwards;
    }
    .corner-tl { top: 15px; left: 15px; border-top: 2px solid rgba(99, 102, 241, 0.4); border-left: 2px solid rgba(99, 102, 241, 0.4); }
    .corner-tr { top: 15px; right: 15px; border-top: 2px solid rgba(99, 102, 241, 0.4); border-right: 2px solid rgba(99, 102, 241, 0.4); }
    .corner-bl { bottom: 15px; left: 15px; border-bottom: 2px solid rgba(99, 102, 241, 0.4); border-left: 2px solid rgba(99, 102, 241, 0.4); }
    .corner-br { bottom: 15px; right: 15px; border-bottom: 2px solid rgba(99, 102, 241, 0.4); border-right: 2px solid rgba(99, 102, 241, 0.4); }

    @keyframes cornerFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Hex pattern particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(99, 102, 241, 0.6);
      border-radius: 50%;
      z-index: 2;
      animation: particleFloat 6s ease-in-out infinite;
    }

    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      50% { transform: translateY(-100px) translateX(30px); }
    }

    /* Glitch flash overlay */
    .glitch-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 90;
      pointer-events: none;
      opacity: 0;
      animation: glitchFlash 4s ease-in-out 0.75s infinite;
    }

    @keyframes glitchFlash {
      0%, 100% { opacity: 0; }
      49% { opacity: 0; }
      49.5% { opacity: 0.03; background: linear-gradient(90deg, transparent 40%, rgba(6, 182, 212, 0.4) 40.5%, transparent 41%); }
      50% { opacity: 0; }
      50.5% { opacity: 0.05; background: linear-gradient(90deg, transparent 60%, rgba(139, 92, 246, 0.3) 60.5%, transparent 61%); }
      51% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="glitch-overlay"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="container">
    <div class="logo-wrapper">
      <img class="logo-img" src="logo.png" alt="Wee" />
      <div class="glitch-ring"></div>
    </div>
    <div class="title">WEE</div>
    <div class="subtitle">AI Agent Control Center</div>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
    <div class="status">
      <span id="status-text">INITIALIZING SYSTEMS</span><span class="cursor">_</span>
    </div>
  </div>

  <!-- Floating particles -->
  <script>
    // Create floating particles
    for (let i = 0; i < 15; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = (Math.random() * 6) + 's';
      p.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(p);
    }

    // Cycle status messages
    const messages = [
      'INITIALIZING SYSTEMS',
      'LOADING NEURAL CORE',
      'SPAWNING WEE SERVER',
      'ESTABLISHING LINK',
      'SYNCHRONIZING',
      'ALMOST READY'
    ];
    let msgIdx = 0;
    const statusEl = document.getElementById('status-text');

    setInterval(() => {
      msgIdx = (msgIdx + 1) % messages.length;
      statusEl.style.opacity = '0';
      setTimeout(() => {
        statusEl.textContent = messages[msgIdx];
        statusEl.style.opacity = '1';
      }, 200);
    }, 1200);
  </script>
</body>
</html>
