<text x="245.0" y="807.0" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Idle — await user</text>
<text x="245" y="809" text-anchor="middle" fill="#6a6a6a" font-size="12">(interactive mode)</text>
