name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Build Nuxt frontend
        run: |
          cd internal/server/frontend
          npm ci
          npm run generate

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - name: Install cross-compilation tools
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/wee-linux-${{ matrix.arch }}" ./cmd/wee

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wee-linux-${{ matrix.arch }}
          path: dist/*

  build-darwin:
    name: Build macOS Binaries
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Build Nuxt frontend
        run: |
          cd internal/server/frontend
          npm ci
          npm run generate

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - name: Build binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/wee-darwin-${{ matrix.arch }}" ./cmd/wee

      - name: Bundle dylibs and fix rpaths (macOS)
        run: |
          BINARY="dist/wee-darwin-${{ matrix.arch }}"

          # Determine the architecture-specific lib directory
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH_DIR="aarch64-apple-darwin"
          else
            ARCH_DIR="x86_64-apple-darwin"
          fi

          # Find the sherpa-onnx dylib directory in Go module cache
          SHERPA_LIB=$(find $HOME/go/pkg/mod/github.com/k2-fsa/sherpa-onnx-go-macos*/lib/${ARCH_DIR} -maxdepth 0 2>/dev/null | head -1)

          if [ -n "$SHERPA_LIB" ]; then
            echo "Found sherpa-onnx libs at: $SHERPA_LIB"

            # Create arch-specific lib directory for bundling
            mkdir -p dist/lib-darwin-${{ matrix.arch }}

            # Copy required dylibs (skip symlink duplicates)
            for dylib in libsherpa-onnx-c-api.dylib libsherpa-onnx-cxx-api.dylib libonnxruntime.1.23.2.dylib; do
              if [ -f "$SHERPA_LIB/$dylib" ]; then
                cp "$SHERPA_LIB/$dylib" dist/lib-darwin-${{ matrix.arch }}/
                echo "Bundled: $dylib"
              fi
            done

            # Create the onnxruntime symlink
            cd dist/lib-darwin-${{ matrix.arch }} && ln -sf libonnxruntime.1.23.2.dylib libonnxruntime.dylib && cd ../..

            # Replace the hardcoded rpath with @executable_path/../lib
            CURRENT_RPATH=$(otool -l "$BINARY" | grep -A 2 "LC_RPATH" | grep "path " | awk '{print $2}')
            if [ -n "$CURRENT_RPATH" ]; then
              echo "Replacing rpath: $CURRENT_RPATH -> @executable_path/../lib"
              install_name_tool -rpath "$CURRENT_RPATH" "@executable_path/../lib" "$BINARY"
            fi

            # Verify the fix
            echo "Updated rpaths:"
            otool -l "$BINARY" | grep -A 2 "LC_RPATH"
          else
            echo "No sherpa-onnx libs found, skipping dylib bundling"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wee-darwin-${{ matrix.arch }}
          path: |
            dist/wee-darwin-${{ matrix.arch }}
            dist/lib-darwin-${{ matrix.arch }}/

