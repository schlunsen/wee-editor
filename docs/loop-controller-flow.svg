<text x="245.0" y="147" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Frontend / WebSocket</text>
<text x="245.0" y="166" text-anchor="middle" fill="#3a3a3a" font-size="12">Create Session (mode), send_prompt</text>
