<rect x="685.0" y="639" width="30" height="18" rx="3" fill="#f8f6f3" fill-opacity="0.95"/>
<text x="700" y="652" text-anchor="middle" fill="#5a5a5a" font-size="12.5">fail</text>
<path d="M 575 722 C 300 800, 50 770, 50 500 C 50 330, 60 282, 118 282" fill="none" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arp)"/>
<rect x="120" y="843" width="360" height="20" rx="3" fill="#f8f6f3" fill-opacity="0.95"/>
<text x="135" y="858" fill="#7c3aed" font-size="13" font-weight="600">loop back → SendPromptSilent(retry + verify output)</text>
<rect x="870" y="640" width="210" height="92" rx="8" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5"/>
