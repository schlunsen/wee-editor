name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, os: linux, arch: amd64, triple: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-22.04-arm, os: linux, arch: arm64, triple: aarch64-unknown-linux-gnu}
          - {runner: macos-15-intel, os: darwin, arch: amd64, triple: x86_64-apple-darwin}
          - {runner: macos-14, os: darwin, arch: arm64, triple: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: internal/server/frontend
        run: |
          npm ci
          npm run generate
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Build and package
        env:
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TRIPLE: ${{ matrix.triple }}
          CGO_ENABLED: '1'
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wee-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum wee-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          name: Wee Editor ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
